<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IMDbRoll</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M18.2 13.5a6.7 6.7 0 1 1-3.1-7.65' fill='none' stroke='%2354575f' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M19.05 4.75v5h-5' fill='none' stroke='%2354575f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script defer src="https://cloud.umami.is/script.js" data-website-id="885d3ea3-566c-48a4-9d9f-e25edadbf66a"></script>
<style>
  :root {
    --bg: #080a0e;
    --surface: #0f1217;
    --surface2: #161b24;
    --accent: #e63946;
    --accent2: #ff6b6b;
    --gold: #f4a261;
    --text: #eef0f5;
    --muted: #7a8099;
    --border: rgba(255,255,255,0.07);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  *::-webkit-scrollbar {
    display: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(to bottom, rgba(8,10,14,0.95) 0%, transparent 100%);
    backdrop-filter: blur(4px);
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(230,57,70,0.5);
  }
  .nav-right { display: flex; gap: 14px; align-items: center; }
  .nav-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-icon:hover { background: var(--accent); border-color: var(--accent); }
  .nav-icon svg { width: 16px; height: 16px; fill: none; stroke: var(--text); stroke-width: 2; }

  /* ── HERO ── */
  #hero {
    position: relative;
    width: 100%;
    height: 100svh;
    min-height: 600px;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-color: #1a0a0a;
    background-size: cover;
    background-position: center top;
    transition: opacity 0.8s ease;
  }
  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(8,10,14,0.4) 0%,
      rgba(8,10,14,0.1) 30%,
      rgba(8,10,14,0.7) 60%,
      rgba(8,10,14,1) 100%
    );
  }

  .hero-content {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 20px 28px;
    z-index: 2;
  }

  .genre-tags {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .genre-tag {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent2);
    background: rgba(230,57,70,0.15);
    border: 1px solid rgba(230,57,70,0.3);
    border-radius: 4px;
    padding: 3px 8px;
  }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(38px, 10vw, 56px);
    line-height: 0.95;
    letter-spacing: 1px;
    margin-bottom: 12px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.8);
  }

  .hero-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .hero-meta .year { color: var(--text); font-weight: 500; }
  .hero-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
  .rating-badge {
    display: flex; align-items: center; gap: 4px;
    background: rgba(244,162,97,0.15);
    border: 1px solid rgba(244,162,97,0.3);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--gold);
  }

  .hero-summary {
    font-size: 13px;
    line-height: 1.6;
    color: rgba(238,240,245,0.75);
    margin-bottom: 22px;
  }
  .expandable-copy {
    display: inline;
  }
  .expandable-toggle {
    display: inline;
    margin-left: 6px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent2);
    font-family: 'DM Sans', sans-serif;
    font-size: inherit;
    font-weight: 600;
    line-height: inherit;
    cursor: pointer;
    white-space: nowrap;
    vertical-align: baseline;
  }

  .hero-buttons {
    display: flex; gap: 10px;
  }
  .btn-play {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 24px rgba(230,57,70,0.35);
  }
  .btn-play:active { transform: scale(0.97); box-shadow: none; }
  .btn-play svg { width: 16px; height: 16px; fill: white; }

  .btn-random {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-random:active { transform: scale(0.97); background: rgba(255,255,255,0.12); }
  .btn-random svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: var(--text);
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .btn-random.rolling {
    pointer-events: none;
    background: rgba(230,57,70,0.18);
    border-color: rgba(230,57,70,0.45);
    box-shadow: 0 0 28px rgba(230,57,70,0.2);
  }
  .btn-random.rolling svg {
    animation: roll-spin 0.7s linear infinite;
  }

  .roll-overlay {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: block;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(8,10,14,0.2), rgba(8,10,14,0.88)),
      radial-gradient(circle at center, rgba(230,57,70,0.1), transparent 62%);
    backdrop-filter: blur(3px);
    transition: opacity 0.06s linear;
  }
  .roll-overlay.visible {
    opacity: 1;
  }
  .roll-poster-stage {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 0;
    overflow: hidden;
    background: #111;
    box-shadow: none;
    transform: perspective(900px) rotateY(0deg) scale(1);
  }
  .roll-poster-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(
        to bottom,
        rgba(8,10,14,0.48) 0%,
        rgba(8,10,14,0.18) 32%,
        rgba(8,10,14,0.62) 70%,
        rgba(8,10,14,0.94) 100%
      ),
      radial-gradient(circle at center, transparent 0 35%, rgba(0,0,0,0.42) 100%);
  }
  .roll-poster-stage::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(90deg,
        rgba(255,255,255,0.18) 0 2%,
        transparent 2% 8%,
        transparent 92%,
        rgba(255,255,255,0.18) 92% 100%
      ),
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.14) 0 7px,
        transparent 7px 22px
      );
    mix-blend-mode: screen;
    opacity: 0.16;
  }
  .roll-poster-stage.spinning {
    animation: poster-hit 0.05s linear infinite;
  }
  .roll-poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.04);
    filter: brightness(0.66) saturate(0.92) contrast(1.04);
  }
  .roll-poster-flash {
    position: absolute;
    inset: 0;
    z-index: 3;
    background:
      linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent),
      radial-gradient(circle at center, rgba(244,162,97,0.12), transparent 55%);
    opacity: 0;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .roll-poster-stage.spinning .roll-poster-flash {
    animation: poster-flash 0.1s linear infinite;
  }

  @keyframes roll-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes poster-hit {
    0% { transform: perspective(900px) rotateY(-3deg) scale(0.985); }
    100% { transform: perspective(900px) rotateY(3deg) scale(1.015); }
  }
  @keyframes poster-flash {
    0%, 100% { opacity: 0; transform: translateX(-35%); }
    45% { opacity: 0.65; }
    60% { transform: translateX(35%); }
  }

  /* ── SCENES ── */
  #scenes-section {
    padding: 24px 0;
    background: var(--bg);
  }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 20px;
    margin-bottom: 14px;
  }
  .scenes-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 20px;
    scrollbar-width: none;
    scroll-behavior: auto;
    perspective: 900px;
  }
  .scenes-scroll::-webkit-scrollbar { display: none; }
  .scenes-shell {
    position: relative;
  }
  .scenes-shell::before,
  .scenes-shell::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 58px;
    z-index: 1;
    pointer-events: none;
  }
  .scenes-shell::before {
    left: 0;
    background: linear-gradient(90deg, var(--bg), transparent);
  }
  .scenes-shell::after {
    right: 0;
    background: linear-gradient(270deg, var(--bg), transparent);
  }
  .scene-scroll-btn {
    position: absolute;
    top: 50%;
    z-index: 2;
    width: 34px;
    height: 52px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px;
    display: grid;
    place-items: center;
    color: rgba(255,255,255,0.92);
    background: rgba(5,6,9,0.64);
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 36px rgba(0,0,0,0.34);
    cursor: pointer;
    transform: translateY(-50%);
    transition: opacity 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
  }
  .scene-scroll-btn:hover {
    border-color: rgba(255,255,255,0.36);
    transform: translateY(-50%) scale(1.04);
  }
  .scene-scroll-btn:active {
    transform: translateY(-50%) scale(0.96);
  }
  .scene-scroll-btn[hidden] {
    display: none;
  }
  .scene-scroll-btn.prev {
    left: 10px;
  }
  .scene-scroll-btn.next {
    right: 10px;
  }
  .scene-scroll-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2.4;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .scene-card {
    flex: 0 0 140px;
    height: 88px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface2);
    cursor: pointer;
    position: relative;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), filter 0.28s ease;
    will-change: transform;
  }
  .scenes-scroll.is-gliding .scene-card {
    filter: saturate(0.92) brightness(0.9);
  }
  .scenes-scroll.is-gliding.forward .scene-card {
    transform: translateX(-7px) rotateY(-4deg) scale(0.965);
  }
  .scenes-scroll.is-gliding.backward .scene-card {
    transform: translateX(7px) rotateY(4deg) scale(0.965);
  }
  .scenes-scroll.is-settling .scene-card {
    filter: saturate(1.04) brightness(1.04);
    transform: translateX(0) rotateY(0) scale(1.012);
    transition-duration: 0.16s;
  }
  .scene-card:active { transform: scale(0.97); }
  .scene-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .scene-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.4) 100%);
  }

  /* ── REVIEWS ── */
  #reviews-section {
    padding: 24px 20px;
    background: var(--bg);
  }
  #links-section {
    padding: 8px 20px 24px;
    background: var(--bg);
    display: flex;
    justify-content: center;
  }
  #trailer-section {
    padding: 8px 20px 20px;
    background: var(--bg);
  }
  .trailer-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
  }
  .trailer-card.visible {
    display: block;
  }
  .trailer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 12px;
  }
  .trailer-kicker {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(238,240,245,0.52);
  }
  .trailer-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .trailer-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: rgba(238,240,245,0.82);
    font-size: 11px;
    white-space: nowrap;
  }
  .trailer-frame-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #090b10;
  }
  .trailer-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .trailer-card.search-mode .trailer-frame {
    display: none;
  }
  .trailer-search {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background:
      radial-gradient(circle at 50% 20%, rgba(230,57,70,0.18), transparent 42%),
      linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
  }
  .trailer-card.search-mode .trailer-search {
    display: flex;
  }
  .trailer-search-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 46px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--text);
    background: rgba(8,10,14,0.62);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 44px rgba(0,0,0,0.32);
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .trailer-search-link:hover {
    transform: translateY(-1px);
    border-color: rgba(255,255,255,0.34);
    background: rgba(16,19,27,0.76);
  }
  .trailer-search-link svg {
    width: 17px;
    height: 17px;
    stroke: currentColor;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .review-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .review-card::before {
    content: '"';
    position: absolute;
    top: -8px; left: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    color: var(--accent);
    opacity: 0.15;
    line-height: 1;
  }
  .review-text {
    font-size: 13px;
    line-height: 1.65;
    color: rgba(238,240,245,0.7);
    font-style: italic;
    position: relative;
    z-index: 1;
  }
  .imdb-link {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text);
    background: linear-gradient(135deg, rgba(255, 209, 102, 0.2), rgba(255,255,255,0.04));
    border: 1px solid rgba(255, 209, 102, 0.24);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    margin: 0 auto;
  }
  .imdb-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 54px;
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    background: linear-gradient(135deg, #f6c945, #ffd86f);
    color: #111;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .imdb-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .imdb-label {
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: rgba(238,240,245,0.58);
  }
  .imdb-title {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.92);
  }

  .scene-lightbox {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(4, 6, 10, 0.82);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 300;
    overscroll-behavior: contain;
  }
  .scene-lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }
  .scene-lightbox-stage {
    width: min(92vw, 920px);
    max-width: 920px;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255,255,255,0.08);
    background: #0c1016;
    touch-action: none;
    overscroll-behavior: contain;
    position: relative;
    z-index: 1;
  }
  .scene-lightbox-track {
    display: flex;
    width: 300%;
    transform: translateX(-33.3333%);
    will-change: transform;
  }
  .scene-lightbox-slide {
    width: 33.3333%;
    flex: 0 0 33.3333%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0c1016;
    overflow: hidden;
  }
  .scene-lightbox-slide img {
    width: 100%;
    height: 100%;
    max-width: min(92vw, 920px);
    max-height: 84vh;
    object-fit: contain;
    display: block;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
    touch-action: none;
  }
  .scene-lightbox-nav {
    position: absolute;
    z-index: 5;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
  }
  .scene-lightbox-nav.prev { left: 18px; }
  .scene-lightbox-nav.next { right: 18px; }
  .scene-lightbox-close {
    position: absolute;
    z-index: 6;
    top: 18px;
    right: 18px;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    font-size: 24px;
    cursor: pointer;
  }
  .scene-lightbox-reset {
    position: absolute;
    z-index: 6;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%) translateY(10px);
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(18px);
    transition: opacity 0.18s ease, transform 0.18s ease, background 0.18s ease;
  }
  .scene-lightbox-reset svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .scene-lightbox.zoomed .scene-lightbox-reset {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 760px) {
    .scene-lightbox {
      padding: 0;
      background: #03050a;
    }
    .scene-lightbox-stage {
      width: 100vw;
      height: 100dvh;
      max-width: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: #03050a;
    }
    .scene-lightbox-slide {
      height: 100dvh;

    }
    .scene-lightbox-slide img {
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      object-fit: contain;
    }
    .scene-lightbox-nav {
      display: none;
    }
    .scene-lightbox-close {
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      width: 48px;
      height: 48px;
      background: rgba(8,10,14,0.54);
      backdrop-filter: blur(18px);
    }
    .scene-lightbox-reset {
      bottom: max(18px, env(safe-area-inset-bottom));
      background: rgba(8,10,14,0.54);
    }
  }

  /* ── STARS ── */
  .stars {
    display: flex; gap: 2px; margin-bottom: 10px;
  }
  .star { font-size: 13px; }
  .star.filled { color: var(--gold); }
  .star.empty { color: var(--surface2); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: rgba(8,10,14,0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  .bnav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px;
  }
  .bnav-item svg { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 1.8; transition: stroke 0.2s; }
  .bnav-item span { font-size: 10px; color: var(--muted); letter-spacing: 0.3px; transition: color 0.2s; }
  .bnav-item.active svg { stroke: var(--accent); }
  .bnav-item.active span { color: var(--accent); }

  /* ── FADE IN ── */
  .fade-up {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .fade-up.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── BOTTOM PADDING ── */
  .bottom-pad {
    height: 80px;
  }

  /* ── DIVIDER ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 20px;
  }

  .app-layout {
    width: 100%;
  }

  .app-column {
    min-width: 0;
  }

  @media (min-width: 1024px) {
    body {
      height: 100vh;
      overflow: hidden;
    }

    .app-layout {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(300px, 1.05fr) minmax(300px, 1fr) minmax(300px, 0.95fr);
      gap: 28px;
      padding: 28px;
      background:
        radial-gradient(circle at 18% 10%, rgba(230,57,70,0.1), transparent 32%),
        radial-gradient(circle at 85% 12%, rgba(244,162,97,0.08), transparent 34%),
        var(--bg);

    .app-column {
      height: calc(100vh - 56px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);

      box-shadow: 0 24px 70px rgba(0,0,0,0.34);

    .roll-column {
      display: flex;

      background: #06070a;

    #hero {
      height: auto;

    #scenes-section {
      flex: 0 0 142px;

    #scenes-section .scenes-shell::before {

    #scenes-section .scenes-shell::after {

    .scene-card {

    .divider,

    .reviews-column,

    .reviews-column::-webkit-scrollbar,
    .media-column::-webkit-scrollbar {

      min-height: 100%;

  }
</style>
</head>

<script>
const MOVIES_URL = 'movies.json';
const REVIEWS_URL = 'reviews.json';
const TRAILERS_URL = 'trailers.json';
const ROLL_SHEETS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwQ2eVGnNnRm0GnItyDf3F3tvHrB-sCIzcwrj8-ju7RK0qPhBKYXRYm-5YRzQfsKBcC/exec';
const UI_TEXT = {
  more: 'More',
  less: 'Less',
  noReview: 'No review text.',
  moviesLoadErrorTitle: 'Movies could not be loaded',
  moviesLoadErrorBody: 'movies.json could not be read. Try opening the page through a local server.',
  movieNotFoundTitle: 'Movie is not in this list',
  movieNotFoundBody: 'This IMDb title id was not found in movies.json.',
  imdbTitleSuffix: 'on IMDb',
  trailerTitleSuffix: 'Official Trailer'
};
let movies = [];
let reviewsByMovie = {};
let reviewsLoadPromise = null;
let trailers = {};
let currentIdx = 0;
let currentSceneIndex = 0;
let lightboxAnimating = false;
let rollAnimating = false;
let rollPosterBank = [];
let sceneScrollAnimation = null;
let lockedScrollY = 0;

// Shuffle (Fisher-Yates) tabanlı sıra — aynı film arka arkaya gelmez,
// tüm filmler bitmeden tekrar başlamaz.
let shuffleQueue = [];

const zoomState = {
  scale: 1,
  x: 0,
  y: 0,
  startScale: 1,
  startX: 0,
  startY: 0,
  startDistance: 0,
  startCenterX: 0,
  startCenterY: 0,
  swipeStartX: 0,
  swipeStartY: 0,
  swipeLastX: 0,
  swipeLastTime: 0,
  swipeDeltaX: 0,
  lastTapTime: 0,
  suppressTapCloseUntil: 0,
  activeGesture: '',
  moved: false,
  isSwiping: false,
  isPanning: false,
  isPinching: false
};

function buildQueue(excludeIdx = -1) {
  const indices = Array.from({ length: movies.length }, (_, i) => i);
  // Fisher-Yates karıştırma
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  // Yeni kuyruk bir önceki filmle başlamasın
  if (indices[0] === excludeIdx && indices.length > 1) {
    const swap = Math.floor(Math.random() * (indices.length - 1)) + 1;
    [indices[0], indices[swap]] = [indices[swap], indices[0]];
  }
  return indices;
}

function getRandom(exclude = -1) {
  if (movies.length <= 1) return 0;
  if (shuffleQueue.length === 0) {
    shuffleQueue = buildQueue(exclude);
  }
  return shuffleQueue.shift();
}

function resetShuffle(exclude = -1) {
  shuffleQueue = buildQueue(exclude);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function samplePosterIndices(count = 5, excludeIdx = -1) {
  if (!movies.length) return [];
  const indices = [];
  const used = new Set([excludeIdx]);
  const maxAttempts = Math.max(count * 8, 80);

  for (let attempts = 0; indices.length < count && attempts < maxAttempts; attempts++) {
    const idx = Math.floor(Math.random() * movies.length);
    if (used.has(idx) || !movies[idx]?.poster) continue;
    used.add(idx);
    indices.push(idx);
  }

  for (let idx = 0; indices.length < count && idx < movies.length; idx++) {
    if (!used.has(idx) && movies[idx]?.poster) {
      used.add(idx);
      indices.push(idx);
    }
  }

  return indices;
}

function preloadRollPosters(excludeIdx = -1) {
  rollPosterBank = samplePosterIndices(5, excludeIdx).map((idx) => {
    const src = movies[idx].poster;
    const img = new Image();
    img.decoding = 'async';
    img.loading = 'eager';
    img.src = src;
    return { idx, src, img };
  });
}

function decodeText(value) {
  const textarea = document.createElement('textarea');
  textarea.innerHTML = String(value ?? '');
  return textarea.value;
}

function getRequestedMovieId() {
  const values = [
    window.location.pathname,
    window.location.search,
    window.location.hash
  ].join('/');
  const match = values.match(/tt\d{6,12}/i);
  return match ? match[0].toLowerCase() : '';
}

function findMovieIndexById(movieId) {
  if (!movieId) return -1;
  return movies.findIndex((movie) => decodeText(movie.tt || '').toLowerCase() === movieId);
}

function renderMovieNotFound(movieId) {
  currentIdx = -1;
  document.getElementById('heroBg').style.opacity = 0;
  document.getElementById('genreTags').innerHTML = '';
  document.getElementById('heroTitle').textContent = UI_TEXT.movieNotFoundTitle;
  document.getElementById('heroYear').textContent = decodeText(movieId || '');
  document.getElementById('heroRating').textContent = '- / 10';
  document.getElementById('heroSummary').textContent = UI_TEXT.movieNotFoundBody;
  document.getElementById('scenesScroll').innerHTML = '';
  updateSceneScrollButtons();
  renderReviews(null, []);

  const imdbLink = document.getElementById('imdbLink');
  imdbLink.href = movieId ? `https://www.imdb.com/title/${encodeURIComponent(movieId)}/` : 'https://www.imdb.com/';
  imdbLink.querySelector('.imdb-title').textContent = movieId ? `${movieId} ${UI_TEXT.imdbTitleSuffix}` : UI_TEXT.imdbTitleSuffix;

  const trailerCard = document.getElementById('trailerCard');
  document.getElementById('trailerFrame').src = '';
  document.getElementById('trailerTitle').textContent = 'No local movie record';
  document.getElementById('trailerSearchLink').href = imdbLink.href;
  trailerCard.classList.add('visible', 'search-mode');
}

function starsHTML(rating) {
  const full = Math.round(rating / 2);
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i <= full ? 'filled' : 'empty'}">&#9733;</span>`;
  }
  return html;
}

function escapeHtml(text = '') {
  return String(text)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function renderExpandableText(text, maxLength) {
  const fullText = decodeText(text || '').trim();
  const needsToggle = fullText.length > maxLength;
  const collapsedText = needsToggle ? `${fullText.slice(0, maxLength).trimEnd()}...` : fullText;
  const buttonHtml = needsToggle
    ? `<button class="expandable-toggle" type="button" aria-expanded="false" data-more-label="${UI_TEXT.more}" data-less-label="${UI_TEXT.less}">${UI_TEXT.more}</button>`
    : '';
  return `<span class="expandable-copy" data-full="${escapeHtml(fullText)}" data-collapsed="${escapeHtml(collapsedText)}" data-expanded="false">${escapeHtml(collapsedText)}</span>${buttonHtml}`;
}

function trailerEmbedUrl(videoId) {
  const safeId = encodeURIComponent(String(videoId || '').trim());
  return `https://www.youtube-nocookie.com/embed/${safeId}?rel=0&modestbranding=1&playsinline=1`;
}

function trailerSearchUrl(movie) {
  const query = `${decodeText(movie.title)} ${decodeText(movie.year || '')} official trailer`.trim();
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
}

function renderTrailer(movie) {
  const trailerCard = document.getElementById('trailerCard');
  const trailerFrame = document.getElementById('trailerFrame');
  const trailerTitle = document.getElementById('trailerTitle');
  const trailerSearchLink = document.getElementById('trailerSearchLink');
  const trailerId = trailers[decodeText(movie.tt)];

  if (!trailerId) {
    trailerTitle.textContent = `${decodeText(movie.title)} Trailer Search`;
    trailerFrame.src = '';
    trailerSearchLink.href = trailerSearchUrl(movie);
    trailerCard.classList.add('visible', 'search-mode');
    return;
  }

  trailerTitle.textContent = `${decodeText(movie.title)} ${UI_TEXT.trailerTitleSuffix}`;
  trailerFrame.src = trailerEmbedUrl(trailerId);
  trailerSearchLink.href = trailerSearchUrl(movie);
  trailerCard.classList.remove('search-mode');
  trailerCard.classList.add('visible');
}

function normalizeReviews(reviews) {
  return Array.isArray(reviews)
    ? reviews.map((review) => ({
        ...review,
        title: decodeText(review?.title),
        body: decodeText(review?.body)
      }))
    : [];
}

function renderReviews(movie, reviews) {
  const revList = document.getElementById('reviewsList');
  const safeReviews = normalizeReviews(reviews);

  if (!safeReviews.length) {
    revList.innerHTML = `
      <div class="review-card fade-up visible">
        <div class="review-text">${UI_TEXT.noReview}</div>
      </div>
    `;
    return;
  }

  revList.innerHTML = safeReviews.map((r, i) => `
    <div class="review-card fade-up" style="transition-delay:${Math.min(i, 4) * 0.06}s">
      <div class="stars">${starsHTML(movie.rating)}</div>
      <div class="review-text">${renderExpandableText(r.body || UI_TEXT.noReview, 260)}</div>
    </div>
  `).join('');

  requestAnimationFrame(() => {
    revList.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
  });
}

async function ensureReviewsLoaded() {
  if (Object.keys(reviewsByMovie).length) return reviewsByMovie;
  if (reviewsLoadPromise) return reviewsLoadPromise;

  reviewsLoadPromise = (async () => {
    const candidates = [REVIEWS_URL, './reviews.json'];
    for (const file of candidates) {
      try {
        const res = await fetch(file, { cache: 'no-store' });
        if (!res.ok) continue;
        const parsed = await res.json();
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
          reviewsByMovie = parsed;
          return reviewsByMovie;
        }
      } catch (_) {}
    }
    reviewsByMovie = {};
    return reviewsByMovie;
  })();

  return reviewsLoadPromise;
}

async function renderReviewsForMovie(movie) {
  const tt = decodeText(movie.tt || '');

  if (Array.isArray(movie.reviews) && movie.reviews.length) {
    renderReviews(movie, movie.reviews);
    return;
  }

  const cached = reviewsByMovie[tt];
  if (cached) {
    renderReviews(movie, cached);
    return;
  }

  document.getElementById('reviewsList').innerHTML = `
    <div class="review-card fade-up visible">
      <div class="review-text">Loading reviews...</div>
    </div>
  `;

  const loaded = await ensureReviewsLoaded();
  if (currentIdx >= 0 && movies[currentIdx]?.tt !== tt) return;
  renderReviews(movie, loaded[tt] || []);
}

function renderMovie(idx) {
  if (!movies.length || !movies[idx]) return;
  const m = movies[idx];
  currentIdx = idx;

  // Hero bg
  const bg = document.getElementById('heroBg');
  bg.style.opacity = 0;
  bg.style.backgroundImage = `url(${m.poster})`;
  // Show immediately even if image fails
  setTimeout(() => { bg.style.opacity = 1; }, 50);

  // Genres
  document.getElementById('genreTags').innerHTML = m.genres.map(g => `<span class="genre-tag">${escapeHtml(decodeText(g))}</span>`).join('');

  // Title
  document.getElementById('heroTitle').textContent = decodeText(m.title);

  // Year
  document.getElementById('heroYear').textContent = decodeText(m.year);

  // Rating
  document.getElementById('heroRating').textContent = m.rating + ' / 10';

  // Summary
  document.getElementById('heroSummary').innerHTML = renderExpandableText(m.summary, 180);

  // Scenes
  const scenes = document.getElementById('scenesScroll');
  scenes.innerHTML = m.scenes.map((s, sceneIndex) => `
    <div class="scene-card" data-scene-index="${sceneIndex}">
      <img src="${s}" alt="scene" loading="lazy" onerror="this.parentElement.style.display='none'">
    </div>
  `).join('');
  scenes.scrollLeft = 0;
  requestAnimationFrame(updateSceneScrollButtons);

  renderReviewsForMovie(m);

  // IMDb link
  const imdbLink = document.getElementById('imdbLink');
  imdbLink.href = `https://www.imdb.com/title/${decodeText(m.tt)}/`;
  imdbLink.querySelector('.imdb-title').textContent = `${decodeText(m.title)} ${UI_TEXT.imdbTitleSuffix}`;

  renderTrailer(m);

  // Trigger fade-ups
  setTimeout(() => {
    document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
  }, 100);

  preloadRollPosters(idx);
}

function updateSceneScrollButtons() {
  const scenes = document.getElementById('scenesScroll');
  const prev = document.getElementById('scenesPrev');
  const next = document.getElementById('scenesNext');
  if (!scenes || !prev || !next) return;

  const maxScroll = Math.max(0, scenes.scrollWidth - scenes.clientWidth);
  const hasOverflow = maxScroll > 4;
  prev.hidden = !hasOverflow || scenes.scrollLeft <= 4;
  next.hidden = !hasOverflow || scenes.scrollLeft >= maxScroll - 4;
}

function easeOutQuart(t) {
  return 1 - Math.pow(1 - t, 4);
}

function animateScenesTo(targetLeft, direction) {
  const scenes = document.getElementById('scenesScroll');
  if (!scenes) return;

  if (sceneScrollAnimation) {
    cancelAnimationFrame(sceneScrollAnimation);
    sceneScrollAnimation = null;
  }

  const startLeft = scenes.scrollLeft;
  const maxScroll = Math.max(0, scenes.scrollWidth - scenes.clientWidth);
  const endLeft = clamp(targetLeft, 0, maxScroll);
  const distance = endLeft - startLeft;
  if (Math.abs(distance) < 2) {
    updateSceneScrollButtons();
    return;
  }

  const duration = clamp(Math.abs(distance) * 0.62, 280, 460);
  const startedAt = performance.now();
  scenes.classList.remove('backward', 'forward', 'is-settling');
  scenes.classList.add('is-gliding', direction > 0 ? 'forward' : 'backward');

  function tick(now) {
    const progress = clamp((now - startedAt) / duration, 0, 1);
    scenes.scrollLeft = startLeft + distance * easeOutQuart(progress);
    updateSceneScrollButtons();

    if (progress < 1) {
      sceneScrollAnimation = requestAnimationFrame(tick);
      return;
    }

    scenes.scrollLeft = endLeft;
    scenes.classList.remove('is-gliding', 'backward', 'forward');
    scenes.classList.add('is-settling');
    sceneScrollAnimation = null;
    updateSceneScrollButtons();
    setTimeout(() => scenes.classList.remove('is-settling'), 170);
  }

  sceneScrollAnimation = requestAnimationFrame(tick);
}

function scrollScenes(direction) {
  const scenes = document.getElementById('scenesScroll');
  if (!scenes) return;
  const firstCard = scenes.querySelector('.scene-card');
  const cardStep = firstCard ? firstCard.getBoundingClientRect().width + 12 : 166;
  const cardsPerMove = Math.max(1, Math.floor((scenes.clientWidth - 44) / cardStep));
  const amount = cardStep * Math.min(3, cardsPerMove);
  animateScenesTo(scenes.scrollLeft + direction * amount, direction);
}

function createRollUserId() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return window.crypto.randomUUID();
  }
  return `roll-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
}

function getRollUserId() {
  const key = 'roll_user_id';
  let userId = '';

  try {
    userId = localStorage.getItem(key) || '';
    if (!userId) {
      userId = createRollUserId();
      localStorage.setItem(key, userId);
    }
  } catch (error) {
    userId = createRollUserId();
  }

  return userId;
}

function trackRoll(movie) {
  if (!movie) return;

  const userId = getRollUserId();
  const movieId = decodeText(movie.tt || '');
  const movieTitle = decodeText(movie.title || '');
  const imdbUrl = `https://www.imdb.com/title/${movieId}/`;

  if (window.umami && typeof window.umami.track === 'function') {
    window.umami.track('roll', {
      visitor: userId,
      movie: movieTitle,
      tt: movieId
    });
  }

  trackRollToSheet({
    visitor: userId,
    movie: movieTitle,
    tt: movieId,
    imdb: imdbUrl
  });
}

function trackRollToSheet(payload) {
  if (!ROLL_SHEETS_ENDPOINT) return;

  fetch(ROLL_SHEETS_ENDPOINT, {
    method: 'POST',
    mode: 'no-cors',
    keepalive: true,
    body: JSON.stringify({
      visitor: payload.visitor,
      movie: payload.movie,
      tt: payload.tt,
      imdb: payload.imdb,
      page: window.location.href,
      created_at: new Date().toISOString()
    })
  }).catch(() => {});
}

async function rollToNextMovie() {
  if (!movies.length || rollAnimating) return;
  rollAnimating = true;

  const button = document.getElementById('randomBtn');
  const overlay = document.getElementById('rollOverlay');
  const posterStage = document.getElementById('rollPosterStage');
  const poster = document.getElementById('rollPoster');
  const nextIdx = getRandom(currentIdx);
  const bank = rollPosterBank.length >= 4 ? rollPosterBank.slice(0, 4) : samplePosterIndices(4, currentIdx).map(idx => ({ idx, src: movies[idx].poster }));
  const frames = [...bank, { idx: nextIdx, src: movies[nextIdx]?.poster }].filter(frame => frame.src).slice(0, 5);
  const frameDelay = 55;

  button.classList.add('rolling');
  overlay.classList.add('visible');
  overlay.setAttribute('aria-hidden', 'false');
  posterStage.classList.add('spinning');

  for (const frame of frames) {
    poster.src = frame.src;
    await sleep(frameDelay);
  }

  renderMovie(nextIdx);
  trackRoll(movies[nextIdx]);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  posterStage.classList.remove('spinning');
  await sleep(30);
  overlay.classList.remove('visible');
  overlay.setAttribute('aria-hidden', 'true');
  poster.removeAttribute('src');
  button.classList.remove('rolling');
  rollAnimating = false;
}

function getSceneList() {
  return movies[currentIdx]?.scenes || [];
}

function normalizeSceneIndex(index) {
  const sceneList = getSceneList();
  if (!sceneList.length) return 0;
  return (index + sceneList.length) % sceneList.length;
}

function currentSceneImage() {
  return document.getElementById('sceneImageCurrent');
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function getMaxPan(scale) {
  const image = currentSceneImage();
  const stage = document.getElementById('sceneLightboxStage');
  if (!image || !stage) return { x: 0, y: 0 };
  return {
    x: Math.max(0, ((image.clientWidth * scale) - stage.clientWidth) / 2),
    y: Math.max(0, ((image.clientHeight * scale) - stage.clientHeight) / 2)
  };
}

function getContainedImageRect(image) {
  const box = image.getBoundingClientRect();
  const naturalWidth = image.naturalWidth || box.width;
  const naturalHeight = image.naturalHeight || box.height;
  const naturalRatio = naturalWidth / naturalHeight;
  const boxRatio = box.width / box.height;
  let width = box.width;
  let height = box.height;

  if (naturalRatio > boxRatio) {
    height = width / naturalRatio;
  } else {
    width = height * naturalRatio;
  }

  return {
    left: box.left + (box.width - width) / 2,
    right: box.left + (box.width + width) / 2,
    top: box.top + (box.height - height) / 2,
    bottom: box.top + (box.height + height) / 2
  };
}

function isPointOutsideCurrentImage(clientX, clientY) {
  const image = currentSceneImage();
  if (!image || !image.src || zoomState.scale > 1.02) return false;
  const rect = getContainedImageRect(image);
  return clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom;
}

function applyZoomTransform(animate = false) {
  const image = currentSceneImage();
  if (!image) return;
  image.style.transition = animate ? 'transform 0.24s ease' : 'none';
  image.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
  document.getElementById('sceneLightbox').classList.toggle('zoomed', zoomState.scale > 1.02);
}

function resetZoom(animate = false) {
  zoomState.scale = 1;
  zoomState.x = 0;
  zoomState.y = 0;
  zoomState.isSwiping = false;
  zoomState.isPanning = false;
  zoomState.isPinching = false;
  zoomState.swipeStartX = 0;
  zoomState.swipeStartY = 0;
  zoomState.swipeLastX = 0;
  zoomState.swipeLastTime = 0;
  zoomState.swipeDeltaX = 0;
  zoomState.lastTapTime = 0;
  zoomState.activeGesture = '';
  zoomState.moved = false;
  applyZoomTransform(animate);
}

function setTrackPosition(percent, animate = false) {
  const track = document.getElementById('sceneLightboxTrack');
  track.style.transition = animate ? 'transform 0.42s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
  track.style.transform = `translate3d(${percent}%, 0, 0)`;
}

function syncLightboxImages() {
  const sceneList = getSceneList();
  if (!sceneList.length) return;
  const prevIndex = normalizeSceneIndex(currentSceneIndex - 1);
  const nextIndex = normalizeSceneIndex(currentSceneIndex + 1);
  document.getElementById('sceneImagePrev').src = sceneList[prevIndex];
  document.getElementById('sceneImageCurrent').src = sceneList[currentSceneIndex];
  document.getElementById('sceneImageNext').src = sceneList[nextIndex];
  resetZoom(false);
}

function showSceneAt(index) {
  const sceneList = getSceneList();
  if (!sceneList.length) return;
  currentSceneIndex = normalizeSceneIndex(index);
  syncLightboxImages();
  setTrackPosition(-33.3333, false);
}

function animateSceneShift(direction) {
  if (lightboxAnimating || zoomState.scale > 1) return;
  lightboxAnimating = true;
  const track = document.getElementById('sceneLightboxTrack');
  const target = direction === 'next' ? -66.6667 : 0;
  setTrackPosition(target, true);
  track.addEventListener('transitionend', () => {
    currentSceneIndex = normalizeSceneIndex(currentSceneIndex + (direction === 'next' ? 1 : -1));
    syncLightboxImages();
    setTrackPosition(-33.3333, false);
    lightboxAnimating = false;
  }, { once: true });
}

function getTouchDistance(touchA, touchB) {
  return Math.hypot(touchA.clientX - touchB.clientX, touchA.clientY - touchB.clientY);
}

function getTouchCenter(touchA, touchB) {
  return {
    x: (touchA.clientX + touchB.clientX) / 2,
    y: (touchA.clientY + touchB.clientY) / 2
  };
}

function beginSwipe(touch) {
  zoomState.activeGesture = 'swipe';
  zoomState.moved = false;
  zoomState.isSwiping = true;
  zoomState.swipeStartX = touch.clientX;
  zoomState.swipeStartY = touch.clientY;
  zoomState.swipeLastX = touch.clientX;
  zoomState.swipeLastTime = performance.now();
  zoomState.swipeDeltaX = 0;
}

function softenedSwipePercent(deltaX, stageWidth) {
  const raw = (deltaX / stageWidth) * 33.3333;
  const limited = Math.sign(raw) * Math.pow(Math.abs(raw), 0.92);
  return clamp(limited, -24, 24);
}

function beginPan(touch) {
  zoomState.activeGesture = 'pan';
  zoomState.moved = false;
  zoomState.isPanning = true;
  zoomState.swipeStartX = touch.clientX;
  zoomState.swipeStartY = touch.clientY;
  zoomState.startX = touch.clientX - zoomState.x;
  zoomState.startY = touch.clientY - zoomState.y;
}

function beginPinch(touchA, touchB) {
  zoomState.activeGesture = 'pinch';
  zoomState.moved = true;
  zoomState.isPinching = true;
  zoomState.isSwiping = false;
  zoomState.isPanning = false;
  zoomState.suppressTapCloseUntil = performance.now() + 520;
  zoomState.startScale = zoomState.scale;
  zoomState.startDistance = getTouchDistance(touchA, touchB);
  const center = getTouchCenter(touchA, touchB);
  zoomState.startCenterX = center.x - zoomState.x;
  zoomState.startCenterY = center.y - zoomState.y;
}

function resetSceneZoom() {
  if (zoomState.scale <= 1.02) return;
  resetZoom(true);
  setTrackPosition(-33.3333, true);
}

function maybeResetZoomOnDoubleTap(touch) {
  if (!touch || zoomState.scale <= 1.02) return false;
  const moved = Math.hypot(
    touch.clientX - zoomState.swipeStartX,
    touch.clientY - zoomState.swipeStartY
  );
  const now = performance.now();
  const isDoubleTap = moved < 12 && now - zoomState.lastTapTime < 320;
  zoomState.lastTapTime = moved < 12 ? now : 0;
  if (isDoubleTap) {
    resetSceneZoom();
    return true;
  }
  return false;
}

function lockPageScroll() {
  lockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${lockedScrollY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
}

function unlockPageScroll() {
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  document.body.style.overflow = '';
  window.scrollTo(0, lockedScrollY);
  lockedScrollY = 0;
}

function openSceneLightbox(index) {
  const lightbox = document.getElementById('sceneLightbox');
  zoomState.suppressTapCloseUntil = 0;
  showSceneAt(index);
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  lockPageScroll();
}

function closeSceneLightbox() {
  const lightbox = document.getElementById('sceneLightbox');
  if (!lightbox.classList.contains('open')) return;
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  ['sceneImagePrev', 'sceneImageCurrent', 'sceneImageNext'].forEach((id) => {
    document.getElementById(id).removeAttribute('src');
  });
  resetZoom(false);
  unlockPageScroll();
}

document.getElementById('randomBtn').addEventListener('click', rollToNextMovie);

// Try to load movies.json from same folder (works when served locally)
async function tryFetchJson() {
  const candidates = [MOVIES_URL, './movies.json'];
  for (const file of candidates) {
    try {
      const res = await fetch(file, { cache: 'no-store' });
      if (!res.ok) continue;
      const parsed = await res.json();
      if (Array.isArray(parsed) && parsed.length) {
        movies = parsed.map((movie) => ({
          ...movie,
          title: decodeText(movie.title),
          summary: decodeText(movie.summary),
          year: decodeText(movie.year),
          tt: decodeText(movie.tt),
          genres: Array.isArray(movie.genres) ? movie.genres.map(decodeText) : []
        }));
        resetShuffle(currentIdx);
        return true;
      }
    } catch (_) {}
  }
  return false;
}

async function tryFetchTrailers() {
  const candidates = [TRAILERS_URL, './trailers.json'];
  for (const file of candidates) {
    try {
      const res = await fetch(file, { cache: 'no-store' });
      if (!res.ok) continue;
      const parsed = await res.json();
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
        trailers = parsed;
        return true;
      }
    } catch (_) {}
  }
  trailers = {};
  return false;
}

// Init
document.addEventListener('DOMContentLoaded', async () => {
  const [loaded] = await Promise.all([tryFetchJson(), tryFetchTrailers()]);
  if (loaded) {
    const requestedMovieId = getRequestedMovieId();
    const requestedIdx = findMovieIndexById(requestedMovieId);
    if (requestedMovieId && requestedIdx < 0) {
      renderMovieNotFound(requestedMovieId);
    } else {
      renderMovie(requestedIdx >= 0 ? requestedIdx : getRandom());
    }
  } else {
    document.getElementById('heroTitle').textContent = UI_TEXT.moviesLoadErrorTitle;
    document.getElementById('heroSummary').textContent = UI_TEXT.moviesLoadErrorBody;
  }
});

document.getElementById('scenesScroll').addEventListener('click', (event) => {
  const card = event.target.closest('.scene-card');
  if (!card) return;
  const sceneIndex = Number(card.dataset.sceneIndex);
  if (Number.isInteger(sceneIndex)) openSceneLightbox(sceneIndex);
});
document.getElementById('scenesScroll').addEventListener('scroll', updateSceneScrollButtons, { passive: true });
document.getElementById('scenesPrev').addEventListener('click', () => scrollScenes(-1));
document.getElementById('scenesNext').addEventListener('click', () => scrollScenes(1));
window.addEventListener('resize', updateSceneScrollButtons);

document.getElementById('sceneLightboxClose').addEventListener('click', closeSceneLightbox);
document.getElementById('sceneLightboxClose').addEventListener('touchend', (event) => {
  event.preventDefault();
  event.stopPropagation();
  closeSceneLightbox();
}, { passive: false });
document.getElementById('sceneLightboxReset').addEventListener('click', resetSceneZoom);
document.getElementById('sceneLightboxReset').addEventListener('touchend', (event) => {
  event.preventDefault();
  event.stopPropagation();
  resetSceneZoom();
}, { passive: false });
document.getElementById('sceneLightboxPrev').addEventListener('click', () => animateSceneShift('prev'));
document.getElementById('sceneLightboxNext').addEventListener('click', () => animateSceneShift('next'));

document.getElementById('sceneLightbox').addEventListener('click', (event) => {
  if (event.target.closest('button')) return;
  if (
    event.target.id === 'sceneLightbox' ||
    isPointOutsideCurrentImage(event.clientX, event.clientY)
  ) {
    closeSceneLightbox();
  }
});

document.getElementById('sceneLightboxStage').addEventListener('touchstart', (event) => {
  if (lightboxAnimating) return;
  event.preventDefault();
  if (event.touches.length === 2) {
    beginPinch(event.touches[0], event.touches[1]);
    return;
  }
  if (event.touches.length !== 1) return;
  if (zoomState.scale > 1) {
    beginPan(event.touches[0]);
  } else {
    beginSwipe(event.touches[0]);
  }
}, { passive: false });

document.getElementById('sceneLightboxStage').addEventListener('touchmove', (event) => {
  if (lightboxAnimating) return;
  event.preventDefault();
  if (event.touches.length === 2) {
    if (!zoomState.isPinching) beginPinch(event.touches[0], event.touches[1]);
    const distance = getTouchDistance(event.touches[0], event.touches[1]);
    const center = getTouchCenter(event.touches[0], event.touches[1]);
    zoomState.scale = clamp((distance / zoomState.startDistance) * zoomState.startScale, 1, 4);
    const limits = getMaxPan(zoomState.scale);
    zoomState.x = clamp(center.x - zoomState.startCenterX, -limits.x, limits.x);
    zoomState.y = clamp(center.y - zoomState.startCenterY, -limits.y, limits.y);
    applyZoomTransform(false);
    return;
  }
  if (event.touches.length !== 1) return;
  const touch = event.touches[0];
  const deltaX = touch.clientX - zoomState.swipeStartX;
  const deltaY = touch.clientY - zoomState.swipeStartY;
  if (Math.hypot(deltaX, deltaY) > 10) {
    zoomState.moved = true;
  }
  if (zoomState.scale > 1) {
    if (!zoomState.isPanning) beginPan(touch);
    const limits = getMaxPan(zoomState.scale);
    zoomState.x = clamp(touch.clientX - zoomState.startX, -limits.x, limits.x);
    zoomState.y = clamp(touch.clientY - zoomState.startY, -limits.y, limits.y);
    applyZoomTransform(false);
    return;
  }
  if (!zoomState.isSwiping) beginSwipe(touch);
  const stageWidth = event.currentTarget.clientWidth || 1;
  const stageHeight = event.currentTarget.clientHeight || 1;
  zoomState.swipeDeltaX = deltaX;
  const shouldCloseVertically = Math.abs(deltaY) > Math.min(100, stageHeight * 0.12) && Math.abs(deltaY) > Math.abs(deltaX) * 1.15;
  if (shouldCloseVertically) {
    closeSceneLightbox();
    return;
  }
  zoomState.swipeLastX = touch.clientX;
  zoomState.swipeLastTime = performance.now();
  const percentOffset = softenedSwipePercent(zoomState.swipeDeltaX, stageWidth);
  setTrackPosition(-33.3333 + percentOffset, false);
}, { passive: false });

document.getElementById('sceneLightboxStage').addEventListener('touchend', (event) => {
  event.preventDefault();
  if (zoomState.isPinching && event.touches.length < 2) {
    zoomState.isPinching = false;
    zoomState.activeGesture = '';
    zoomState.moved = false;
    zoomState.suppressTapCloseUntil = performance.now() + 520;
    if (zoomState.scale <= 1.02) {
      resetZoom(true);
    } else {
      const limits = getMaxPan(zoomState.scale);
      zoomState.x = clamp(zoomState.x, -limits.x, limits.x);
      zoomState.y = clamp(zoomState.y, -limits.y, limits.y);
      applyZoomTransform(true);
    }
    return;
  }

  const endedTouch = event.changedTouches[0];
  const tapDistance = endedTouch
    ? Math.hypot(endedTouch.clientX - zoomState.swipeStartX, endedTouch.clientY - zoomState.swipeStartY)
    : Infinity;
  const isCleanTap = event.touches.length === 0 && tapDistance < 18 && !zoomState.moved && performance.now() > zoomState.suppressTapCloseUntil;
  if (isCleanTap) {
    closeSceneLightbox();
    return;
  }
  if (zoomState.scale > 1) {
    zoomState.isPanning = false;
    zoomState.activeGesture = '';
    zoomState.moved = false;
    return;
  }
  if (!zoomState.isSwiping) return;
  zoomState.isSwiping = false;
  const stageWidth = event.currentTarget.clientWidth || 1;
  const timeDiff = Math.max(1, performance.now() - zoomState.swipeLastTime);
  const velocityX = (event.changedTouches[0]?.clientX - zoomState.swipeLastX) / timeDiff;
  const shouldAdvance = Math.abs(zoomState.swipeDeltaX) > stageWidth * 0.12 || Math.abs(velocityX) > 0.32;
  if (shouldAdvance) {
    animateSceneShift(zoomState.swipeDeltaX > 0 ? 'prev' : 'next');
  } else {
    setTrackPosition(-33.3333, true);
  }
  zoomState.swipeDeltaX = 0;
  zoomState.activeGesture = '';
  zoomState.moved = false;
}, { passive: false });

document.getElementById('sceneLightboxStage').addEventListener('touchcancel', (event) => {
  event.preventDefault();
  if (zoomState.scale > 1) {
    const limits = getMaxPan(zoomState.scale);
    zoomState.x = clamp(zoomState.x, -limits.x, limits.x);
    zoomState.y = clamp(zoomState.y, -limits.y, limits.y);
    applyZoomTransform(true);
    return;
  }
  setTrackPosition(-33.3333, true);
  zoomState.isSwiping = false;
  zoomState.isPanning = false;
  zoomState.isPinching = false;
  zoomState.swipeDeltaX = 0;
}, { passive: false });

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    closeSceneLightbox();
  }
  const lightboxOpen = document.getElementById('sceneLightbox').classList.contains('open');
  if (!lightboxOpen || zoomState.scale > 1) return;
  if (event.key === 'ArrowLeft') {
    animateSceneShift('prev');
  }
  if (event.key === 'ArrowRight') {
    animateSceneShift('next');
  }
});

document.addEventListener('click', (event) => {
  const button = event.target.closest('.expandable-toggle');
  if (!button) return;
  const copy = button.previousElementSibling;
  if (!copy || !copy.classList.contains('expandable-copy')) return;
  const expanded = copy.dataset.expanded === 'true';
  copy.dataset.expanded = expanded ? 'false' : 'true';
  copy.textContent = expanded ? copy.dataset.collapsed : copy.dataset.full;
  button.textContent = expanded ? button.dataset.moreLabel : button.dataset.lessLabel;
  button.setAttribute('aria-expanded', expanded ? 'false' : 'true');
});
